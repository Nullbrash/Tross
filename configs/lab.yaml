# Конфигурация для закрытого стенда (scripts/lab-netns): демон работает
# внутри netns tl-tross, «провайдеры» и «интернет» — соседние netns.
#   sudo ip netns exec tl-tross bin/trossd -config configs/lab.yaml

daemon:
  dry_run: false
  data_dir: /tmp/tross-lab

log:
  level: info

api:
  listen: 192.168.77.1:8080
  allowed_networks: [127.0.0.0/8, 192.168.77.0/24]

lan:
  interface: lan
  networks: [192.168.77.0/24]

links:
  - { id: isp1, name: ISP 1, kind: wired, interface: wan1, gateway: 100.64.1.1, priority: 10 }
  - { id: isp2, name: ISP 2, kind: wired, interface: wan2, gateway: 100.64.2.1, priority: 20 }
  - { id: lte,  name: LTE,   kind: lte,   interface: wan3, gateway: 100.64.3.1, priority: 100,
      whitelist_detection: true }

monitor:
  targets: [203.0.113.1, 203.0.113.2, 203.0.113.3]
  whitelist_targets: [203.0.113.3]
  interval: 2s
  timeout: 1s
  # DNS стенда отвечает 203.0.113.10 (labsrv) на любое имя.
  http_check:
    interval: 4s
    dns: [203.0.113.53]
    urls:
      - { url: "http://check.lab/generate_204", status: 204 }
      - { url: "http://check.lab/success.txt", status: 200, body: success }
  speedtest:
    urls: ["http://203.0.113.10/bytes?n=200000000"]

classes:
  - { id: default, selector: ordered, links: [isp1, isp2], fallback: [lte] }

dns:
  listen: ["192.168.77.1:53"]
