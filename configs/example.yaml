# Пример конфигурации trossd.
# Поля, которые можно опустить, помечены «по умолчанию: …».
# Неизвестное поле — ошибка (защита от опечаток).

daemon:
  # «Сухой» режим: ничего не менять в системе, монитор и dataplane — фейковые.
  dry_run: true
  # База tross.db (события, статистика) и рабочие файлы; флаг -data-dir заменяет.
  data_dir: /var/lib/tross          # по умолчанию: /var/lib/tross

log:
  level: info                       # debug | info | warn | error
  format: text                      # text | json
  ring_size: 5000                   # свежие записи в памяти (SSD не трогаем)

api:
  # В рабочей установке — адрес мини-ПК в LAN, например 192.168.10.1:8080.
  listen: 127.0.0.1:8080
  # Откуда разрешён доступ. По умолчанию: 127.0.0.0/8 + lan.networks.
  # allowed_networks: [127.0.0.0/8, 192.168.10.0/24]

lan:
  interface: enp1s0
  networks: [192.168.10.0/24]

# Каналы. table и fwmark по умолчанию выводятся из порядка:
# 1-й канал — таблица 101, метка 0x100; 2-й — 102 и 0x200; и т.д.
links:
  - id: isp1
    name: Провайдер 1 (GPON)
    kind: wired                     # wired | lte
    interface: enp2s0
    gateway: auto                   # auto (из DHCP) или IPv4 шлюза
    priority: 10                    # меньше — предпочтительнее при равенстве
    # Очередь CAKE в обе стороны: стоит чуть ниже настоящей скорости канала,
    # чтобы пакеты копились у нас, а не у провайдера, — тогда пинг под
    # нагрузкой не растёт и работают приоритеты классов. Скорость очереди =
    # база × процент. Очередь остаётся и после остановки демона (снимает
    # только trossd -purge).
    sqm:
      enabled: true
      # База: число — скорость канала, замеры её не меняют; 0 — из замеров
      # (тарифу не доверяем): ночной тест скорости как нижняя граница и
      # насыщение канала под нагрузкой; до первого замера — без ограничения
      # скорости (у LTE теста нет — база по первой настоящей нагрузке).
      down_mbit: 0
      up_mbit: 0                    # теста отдачи нет: 0 — только по нагрузке
      start_pct: 90                 # процент от базы при старте
      min_pct: 80                   # пределы автоподстройки (у LTE по
      max_pct: 97                   #   умолчанию 50–95)
      # Подстраивать по задержке под нагрузкой: растёт задержка — очередь
      # ниже, канал упирается в очередь без задержки — выше; false —
      # всегда start_pct.
      auto: true

  - id: isp2
    name: Провайдер 2
    kind: wired
    interface: enp3s0
    gateway: auto
    priority: 20
    sqm: { enabled: true }

  - id: lte
    name: LTE
    kind: lte
    interface: enp4s0
    gateway: 192.168.8.1
    priority: 100
    # metered: true                 # по умолчанию true для lte
    quota: { monthly_gb: 50, reset_day: 1 }   # пока не используется (идея учёта квоты LTE)
    # whitelist_detection: true     # по умолчанию true у всех каналов
    # probe_targets: [1.1.1.1, 8.8.4.4]  # свои цели проб; по умолчанию monitor.targets
    sqm: { enabled: true }

monitor:
  # Зарубежные цели в разных AS (Cloudflare, Google, Quad9) + российские в
  # разных AS (Яндекс, MSK-IX, Билайн). 8.8.4.4 вместо 8.8.8.8: в июле 2026
  # у 8.8.8.8 резали TCP. Пинг — дешёвый, но не доказательство: см. tcp_targets.
  targets: [1.1.1.1, 8.8.4.4, 9.9.9.9, 77.88.8.8, 195.208.4.1, 194.67.2.114]
  interval: 2s
  timeout: 1s
  window: 30                        # раундов в окне расчёта задержки/джиттера/потерь
  fail_after: 3                     # раундов без ответов подряд до down (~6 с)
  recover_after: 10                 # удачных подряд до возврата в up (~20 с)
  # Российские цели (доступны и в режиме «белых списков»): отвечают только они
  # → канал restricted; молчат и они → канал просто плохой (down).
  whitelist_targets: [77.88.8.8, 195.208.4.1, 194.67.2.114]
  # TCP-проба каждый раунд (по кругу): ICMP проходит, когда TCP режется, и
  # наоборот; стабильно падающий TCP при живом ping даёт degraded.
  tcp_targets: [1.1.1.1:443, 8.8.4.4:443, 9.9.9.9:443]
  # Проверка «настоящего» интернета: ping может идти, а HTTP — резаться или
  # подменяться (страница авторизации, «белые списки»). fail_after неудач
  # подряд → канал restricted. Запросы и DNS — через сам канал, без
  # перехода по перенаправлениям. Достаточно ответа одного зарубежного адреса;
  # российские (domestic, только https, status 0 — любой ответ) различают «нет
  # зарубежного» (вероятно, белые списки) и «нет HTTP вовсе».
  http_check:
    enabled: true
    interval: 30s
    timeout: 5s
    fail_after: 2
    # Резолверы проверки — только по IP: «https://IP/путь» — DoH, «tls://IP» —
    # DoT, просто IP — обычный DNS на порт 53. По умолчанию DoH: у части
    # провайдеров открытый DNS к сторонним серверам закрыт, и проверка без
    # адресов сочла бы исправный канал ограниченным.
    dns: ["https://1.1.1.1/dns-query", "https://8.8.4.4/dns-query", "https://9.9.9.9/dns-query"]
    urls:
      - { url: "http://cp.cloudflare.com/generate_204", status: 204 }
      - { url: "https://www.gstatic.com/generate_204", status: 204 }
      - { url: "http://detectportal.firefox.com/success.txt", status: 200, body: success }
      - { url: "http://www.msftconnecttest.com/connecttest.txt", status: 200, body: "Microsoft Connect Test" }
      - { url: "https://ya.ru/", domestic: true }
      - { url: "https://www.gosuslugi.ru/", domestic: true }
  # Скорость: всегда пассивно по реальному трафику; активный тест — на
  # проводных раз в сутки в `at`, на лимитированных (LTE) — только по команде.
  speedtest:
    # Один ответ сервера ограничен (Cloudflare: 403 на >= 100 МБ) — тест
    # повторяет запросы в 2 потока (больше 3 TLS к одному имени за минуту ТСПУ
    # может «заморозить») до duration или max_bytes. Берётся следующий адрес,
    # если передача застыла (3 с без данных — блок источника, а не скорость)
    # или источник отвечает короткими страницами-заглушками (< 64 КБ).
    urls:
      - https://speed.cloudflare.com/__down?bytes=50000000
      - https://web1.cachefly.net/speedtest/downloading
    at: "04:00"
    duration: 10s
    max_bytes: 200000000

# Классы трафика и их политики. Класс соединения определяет классификатор
# (раздел classify и встроенные профили сервисов), не подошло ничто — default.
#   selector:   lowest_latency | best_throughput | best_upload | balanced | ordered
#   stickiness: none | session | destination  (+ sticky_ttl); части сервисов
#               вроде видео YouTube закрепляются «устройство + сервис» сами
#   links:      основной пул (пусто — все, кроме fallback)
#   fallback:   только когда весь основной пул непригоден
#   канал вне links и fallback при непустом links для класса запрещён
#   method:     auto (по спискам доменов) | direct | direct_dpi | proxy
#   priority:   корзина очереди CAKE: high — голос (впереди всех, до ~25 %
#               канала) | video — видео (до ~50 %) | normal | low — фон
#               (при занятом канале ~6 %); внутри корзины — поровну между
#               устройствами
classes:
  - id: gaming
    name: Игры
    selector: lowest_latency
    stickiness: session
    sticky_ttl: 2h
    links: [isp1, isp2]
    fallback: [lte]
    method: direct
    allow_proxy: false
    priority: high

  - id: voip
    name: Звонки
    selector: lowest_latency
    stickiness: session
    sticky_ttl: 2h
    links: [isp1, isp2]
    fallback: [lte]
    method: auto
    allow_proxy: false
    priority: high

  - id: streaming
    name: Видео
    selector: best_throughput
    links: [isp1, isp2]
    fallback: [lte]
    method: auto
    allow_proxy: true
    priority: video

  - id: bulk
    name: Фоновые загрузки
    selector: balanced
    links: [isp1, isp2]             # LTE нет ни здесь, ни в fallback — никогда через LTE
    method: direct
    priority: low

  - id: ip_sensitive
    name: Чувствительные к смене IP
    selector: ordered
    stickiness: destination
    sticky_ttl: 24h
    links: [isp1, isp2]
    fallback: [lte]
    method: auto
    allow_proxy: false
    priority: normal

  # Свои трансляции (YouTube, Twitch): канал с лучшей отдачей на весь эфир;
  # LTE нет и в запасных. Каждая платформа — отдельное соединение, поэтому
  # мультистрим может занять отдачу разных каналов.
  - id: broadcast
    name: Свои трансляции
    selector: best_upload
    stickiness: destination
    sticky_ttl: 12h
    links: [isp1, isp2]
    method: auto
    allow_proxy: true
    priority: video

  - id: default
    name: Прочее
    selector: balanced
    links: [isp1, isp2]
    fallback: [lte]
    method: auto
    allow_proxy: true
    priority: normal

# Классификация соединений. Встроенный каталог профилей сервисов (Steam,
# YouTube, Twitch, Discord, звонки по STUN, торренты, Minecraft Java)
# работает и без этого раздела; здесь — свои правила и свои профили.
# Порядок: свои правила → свои доменные правила → профили → онлайн-списки →
# класс default. Условия: proto, ports (порт назначения), networks (IPv4),
# domains (суффиксы; работают с резолвером, этап 4), signature (признак
# первого пакета UDP: stun, discord_voice, utp, dht). Все поля — «и».
classify:
  rules: []
  #  - name: pc-torrent          # входящие к торрент-клиенту ПК — загрузки
  #    class: bulk
  #    devices: [192.168.10.20]  # до реестра устройств — по IPv4
  #    proto: tcp
  #    ports: ["51413"]
  services: []
  #  - id: steam                 # свой профиль с тем же id заменяет встроенный
  #    disabled: true            # …или выключает его

# Входящие из интернета к устройствам дома. Всё, что не ответ на соединение
# из дома и не проброс, отбрасывается всегда (как на обычном роутере).
# Ручные пробросы портов: проброс открыт на каждом канале из links (пусто —
# на всех); ответ уходит в тот канал, через который пришёл запрос. Снаружи
# проброс достижим, только если у канала публичный («белый») адрес — LTE
# обычно за NAT оператора. Фильтр, пробросы и защита остаются и при
# остановке демона (вместе с NAT): сервер доступен через основной канал.
# Из домашней сети по внешнему адресу — не работает (обращайтесь по адресу
# устройства в LAN).
inbound:
  forwards: []
  #  - name: minecraft
  #    proto: tcp                # tcp | udp | both; по умолчанию tcp
  #    port: 25565               # внешний порт или диапазон "27015-27030"
  #    to: 192.168.10.50         # устройство (адрес из lan.networks)
  #    to_port: 25565            # порт на устройстве; по умолчанию — как port
  #    links: [isp1, isp2]
  # Защита пробросов — всегда включена, общая для всех; ограничения — на
  # один адрес в интернете. Лишнее отбрасывается молча.
  guard:
    new_per_minute: 20          # новых соединений в минуту…
    burst: 20                   # …сверх разового всплеска
    max_connections: 32         # одновременных соединений

# DNS-резолвер — этап 4, в работе (сейчас проверяется только конфиг).
# Наружу — только зашифрованный DNS (DoH https://, DoT tls://) и только по
# IP: DoH/DoT по имени сервера (cloudflare-dns.com и др.) в России обрывают
# по SNI. DNS провайдера не используется: он видит имена и подменяет ответы
# заглушками блокировок.
dns:
  listen: ["192.168.10.1:53"]
  # Два набора серверов (по умолчанию — список ниже):
  #   protected — особо личное (раздел sensitive): серверы вне России без
  #               журналов; домен всегда идёт к одному серверу (каждый видит
  #               только свою долю имён), при его отказе — к его backup;
  #               особо личное никогда не уходит в быстрый набор;
  #   fast      — всё остальное: гонка race быстрейших, первый ответ с
  #               адресами побеждает.
  # Сервер без pools — только запасной (backup) для чужой доли.
  upstreams:
    - { name: quad9,            url: "https://9.9.9.9/dns-query", pools: [protected, fast], backup: quad9-unfiltered }
    # tls_name — сертификат выдан на имя, а не на IP: проверять по имени
    # (наружу уходит только IP — имя в SNI в России обрывают).
    - { name: mullvad,          url: "https://194.242.2.2/dns-query", pools: [protected], backup: dnssb, tls_name: dns.mullvad.net }
    - { name: digitale,         url: "https://185.95.218.42/dns-query", pools: [protected], backup: dnssb, tls_name: dns.digitale-gesellschaft.ch }
    - { name: dns4eu,           url: "tls://86.54.11.100", pools: [protected], backup: dnssb, tls_name: unfiltered.joindns4.eu }
    - { name: quad9-unfiltered, url: "https://9.9.9.10/dns-query" }   # без фильтра вредоносного
    - { name: dnssb,            url: "https://185.222.222.222/dns-query" }
    - { name: cloudflare,       url: "https://1.1.1.1/dns-query", pools: [fast] }
    - { name: cloudflare-2,     url: "https://1.0.0.1/dns-query", pools: [fast] }
    - { name: google,           url: "https://8.8.4.4/dns-query", pools: [fast] }   # 8.8.8.8 нестабилен
    # Свой профиль NextDNS (идентификатор — только в своём конфиге):
    # - { name: nextdns, url: "https://dns.nextdns.io/<ID>", pools: [fast] }
  race: 2                           # серверов быстрого набора разом
  # Особо личное: сервисы каталога профилей (или их части — "steam/store") и
  # домены (с поддоменами). Свой список заменяет этот целиком.
  sensitive:
    # Steam — только магазин: загрузки через защищённый набор попадают на
    # дальние узлы CDN.
    services: [steam/store, youtube, discord]
    domains: [telegram.org, t.me, telegram.me, telegra.ph, tdesktop.com, telesco.pe, cdn-telegram.org,
              gmail.com, googlemail.com, mail.google.com,
              proton.me, protonmail.com, outlook.com, hotmail.com, mail.ru, mail.yandex.ru,
              sberbank.ru, sber.ru, tbank.ru, tinkoff.ru, vtb.ru, alfabank.ru, gazprombank.ru,
              raiffeisen.ru, open.ru, sovcombank.ru, pochtabank.ru, psbank.ru, mtsbank.ru,
              rshb.ru, rosbank.ru]
    # Весь защищённый набор недоступен: true — временно спрашивать быстрый
    # (имена увидят его серверы); false — особо личное не открывается, пока
    # защищённый не вернётся.
    fallback_fast: false
  bootstrap: [1.1.1.1, 8.8.4.4]     # для апстримов, заданных именем
  cache_size: 10000
  set_ttl: { min: 5m, max: 12h }    # пределы таймаута IP в множествах nftables
  firefox_canary_nxdomain: true     # NXDOMAIN на use-application-dns.net
  watchdog: { interval: 5s, failures: 3 }

# Онлайн-списки — этап 4. Нижний слой правил: ручные > выученные >
# встроенные в Tross («никогда не трогать»: время, STUN, игровые сети,
# проверки подключения, push) > онлайн.
# purpose: bypass — кандидаты на обход (метод определит проверка, этапы 5–6);
#          inside — доступно только изнутри России (не через зарубежный выход);
#          never  — не уводить в обход и прокси;
#          class  — домены класса трафика (тогда нужен class).
# format:  text (домен в строке; domain:/full:/keyword:, hosts, ||домен^) или
#          geosite (v2fly, с categories). disabled: true — источник не грузится.
# checksum: адрес контрольной суммы — большой файл качается, только если
#          она сменилась. Загрузка — только через исправные неплатные каналы
#          (не LTE), условным запросом; кеш — в каталоге данных: перезапуск и
#          недоступный или битый источник работу не ломают.
# Размеры (2026-10): itdog — 1,2 тыс. доменов (16 КБ); runetfreedom — один
# geosite на 74 МБ (в «только изнутри» — 167 доменов, «заблокировано» — 75
# тыс.); antifilter community — 0,5 тыс.; re:filter — 81 тыс. (1,3 МБ).
lists:
  update_interval: 24h
  # Свои правила — важнее всех списков (exact: true — без поддоменов):
  # manual:
  #   - { domains: [example.org], purpose: bypass }
  #   - { domains: [kino.example], purpose: class, class: streaming }
  sources:
    - id: itdog-inside
      url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-raw.lst
      format: text
    # «Только изнутри России» — 167 доменов внутри общего файла на 74 МБ
    # (обновляется несколько раз в сутки); нужен прокси (этап 6) — до него
    # выключен.
    - id: runetfreedom-inside
      url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
      format: geosite
      categories: [ru-available-only-inside]
      purpose: inside
      checksum: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat.sha256sum
      disabled: true
    # Шире, но больше памяти и лишнего (заблокировано по реестру, а
    # открывается напрямую):
    - id: antifilter-community
      url: https://community.antifilter.download/list/domains.lst
      format: text
      disabled: true
    - id: refilter
      url: https://github.com/1andrevich/Re-filter-lists/releases/latest/download/domains_all.lst
      format: text
      disabled: true
    - id: runetfreedom-blocked
      url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
      format: geosite
      categories: [ru-blocked]
      checksum: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat.sha256sum
      disabled: true

# Обход DPI (zapret) — этап 5, пока не используется.
dpi:
  enabled: false
  nfqws: /opt/zapret/nfq/nfqws
  queue_base: 200                   # очередь канала = queue_base + номер канала
  recheck_interval: 24h
  probe_domains: [rutracker.org, youtube.com]

# Прокси-ядро (mihomo) — этап 6, пока не используется.
proxy:
  enabled: false
  engine: mihomo
  binary: /usr/local/lib/tross/mihomo
  version: v1.19.32                 # зафиксированная версия; иная — не запускаем
  # work_dir: /var/lib/tross/mihomo # по умолчанию: <data_dir>/mihomo
  controller: 127.0.0.1:9090        # только loopback
  tproxy_port_base: 7900            # прокси N слушает tproxy_port_base + N
  routing_mark_base: 0x10000        # метки прокси — выше меток каналов
  # Ключи и подписки добавляются через интерфейс и хранятся в БД.

# Реестр устройств — этап 7, пока не используется.
devices:
  notify_new: true
  default_dns_mode: observe         # observe | redirect | block | exempt
